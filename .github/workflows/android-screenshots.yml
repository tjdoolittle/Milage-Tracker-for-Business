name: Android screenshots

# Runs the debug app on an emulator with made-up sample data and captures the
# screens used for the Google Play listing. Results go to the ci-android-shots
# branch. Manual, or on pushes that change the Android app.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "!android/store-listing/**"
      - ".github/workflows/android-screenshots.yml"
  pull_request:
    paths:
      - "android/**"
      - "!android/store-listing/**"

concurrency:
  group: android-shots
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the debug app
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/scripts/capture-screens.sh

      - name: Publish to the ci-android-shots branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/out && cp -r android/shots/. /tmp/out/ 2>/dev/null || true
          echo "run ${{ github.run_number }} sha ${{ github.sha }} status ${{ job.status }}" > /tmp/out/RUN
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan shots-tmp
          git rm -rfq .
          git clean -fdxq
          cp -r /tmp/out/. .
          git add -A
          git commit -qm "Android screenshots for run ${{ github.run_number }}"
          git push -fq origin HEAD:${{ github.event_name == 'pull_request' && 'ci-android-shots-pr' || 'ci-android-shots' }}
