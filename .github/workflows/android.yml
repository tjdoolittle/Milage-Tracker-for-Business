name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Write the signing key
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are not set. See android/README.md (Signing)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > app/mileage-log.jks

      - name: Build signed APK
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Name the APK
        working-directory: android
        run: |
          rm -f app/mileage-log.jks
          test -f app/build/outputs/apk/release/app-release.apk || { echo "::error::No signed APK was produced"; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk "MileageLog-1.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MileageLog-1.1.${{ github.run_number }}
          path: android/MileageLog-*.apk

      - name: Publish release
        working-directory: android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "android-v1.1.${{ github.run_number }}" MileageLog-*.apk \
            --title "Mileage Log for Android 1.1.${{ github.run_number }}" \
            --notes "Download the APK below and open it on your Android phone to install or update. Updates install over the previous version and keep your trips." \
            --latest

      - name: Save build log for review
        if: failure()
        shell: bash
        run: |
          rm -f android/app/mileage-log.jks
          cp android/build.log /tmp/build.log 2>/dev/null || echo "No build log" > /tmp/build.log
          grep -nE "^e: |^w: .*error|error:|What went wrong|FAILURE|Could not" -A4 /tmp/build.log > /tmp/errors.txt || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rfq .
          git clean -fdxq
          cp /tmp/build.log build.log
          cp /tmp/errors.txt errors.txt
          echo "run ${{ github.run_number }} sha ${{ github.sha }}" > RUN
          git add build.log errors.txt RUN
          git commit -qm "Build log for run ${{ github.run_number }}"
          git push -fq origin HEAD:ci-android
