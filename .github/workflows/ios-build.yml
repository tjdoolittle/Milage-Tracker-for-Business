name: iOS build and screenshots

# Compiles for the simulator with signing off (no secrets, no Apple account),
# then launches the app with sample data and captures screenshots. On pushes
# to main the build log and screenshots are published to the `ci-ios` branch
# so they can be reviewed without opening the Actions UI.
#

# The repo is private, where macOS minutes count 10x, so this only runs when
# the iPhone app (or this workflow) changes.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ios

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write   # only to publish the ci-ios results branch
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project MileageLog.xcodeproj \
            -scheme MileageLog \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Capture screenshots
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          phones = [d for d in devs if d["name"].startswith("iPhone")]
          pick = [d for d in phones if d["name"].endswith(" Pro")] or phones
          print(pick[-1]["udid"])')
          echo "Simulator: $udid"
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          app=build/Build/Products/Debug-iphonesimulator/MileageLog.app
          xcrun simctl install "$udid" "$app"
          mkdir -p shots
          shot() {
            name="$1"; shift
            xcrun simctl terminate "$udid" com.tjdoolittle.mileagelog 2>/dev/null || true
            xcrun simctl launch "$udid" com.tjdoolittle.mileagelog -demo "$@"
            sleep 7
            xcrun simctl io "$udid" screenshot "shots/$name.png"
          }
          shot 01-home
          shot 02-tracking -active
          shot 03-review -screen editor
          shot 04-settings -screen settings
          xcrun simctl ui "$udid" appearance dark
          shot 05-dark -active
          ls -la shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots-${{ github.run_number }}
          path: |
            ios/shots/*.png
            ios/build.log
          if-no-files-found: ignore

      - name: Publish results to the ci-ios branch
        if: always() && github.event_name == 'push'
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          mkdir -p /tmp/out
          cp ios/build.log /tmp/out/ 2>/dev/null || echo "no build log" > /tmp/out/build.log
          grep -nE "error:" -A3 /tmp/out/build.log > /tmp/out/errors.txt || true
          cp ios/shots/*.png /tmp/out/ 2>/dev/null || true
          echo "run ${{ github.run_number }} sha ${{ github.sha }} status ${{ job.status }}" > /tmp/out/RUN
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-ios-tmp
          git rm -rfq .
          git clean -fdxq
          cp /tmp/out/* .
          git add -A
          git commit -qm "iOS build results for run ${{ github.run_number }}"
          git push -fq origin HEAD:ci-ios
